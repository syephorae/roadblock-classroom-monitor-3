type User @table {
  displayName: String!
  email: String!
  role: String!
  createdAt: Timestamp!
  photoUrl: String
}

type Classroom @table {
  name: String!
  createdAt: Timestamp!
  description: String
  teacher: User
}

type Student @table {
  displayName: String!
  studentId: String!
  createdAt: Timestamp!
  email: String
  classroom: Classroom
}

type Policy @table {
  type: String!
  value: String!
  createdAt: Timestamp!
  description: String
  classroom: Classroom
}

type Session @table {
  startTime: Timestamp!
  isActive: Boolean!
  createdAt: Timestamp!
  endTime: Timestamp
  classroom: Classroom
  teacher: User
}